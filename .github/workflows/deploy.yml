name: Deploy with Docker Compose

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tteokgle-server:latest
            ${{ secrets.DOCKER_USERNAME }}/tteokgle-server:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to App Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd /home/ubuntu

            # 이번 배포는 커밋 SHA 태그로 정확히 고정해서 가져옴
            export IMAGE_TAG=${{ github.sha }}

            # 최신 이미지 pull
            docker-compose pull app

            # 컨테이너 강제 재생성 (최신 이미지 반영 보장)
            docker-compose up -d --force-recreate --no-deps app

            # 구 이미지 정리
            docker image prune -f

            # 어떤 이미지로 떠있는지 출력(디버깅용)
            docker-compose ps
            docker inspect -f 'APP image={{.Config.Image}} id={{.Image}}' $(docker-compose ps -q app) || true
