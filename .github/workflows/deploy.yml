name: Deploy with Docker Compose

on:
  push:
    branches: [ develop ]

env:
  IMAGE_NAME: tteokgle-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to App Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd /home/ubuntu

            export IMAGE_TAG=${{ github.sha }}

            docker compose pull app
            docker compose up -d --force-recreate db redis app

            docker image prune -f

            docker compose ps
            APP_CID=$(docker compose ps -q app)
            if [ -z "$APP_CID" ]; then
              echo "app container not found after deploy"
              exit 1
            fi

            APP_STATE=$(docker inspect -f '{{.State.Status}}' "$APP_CID")
            docker inspect -f 'APP image={{.Config.Image}} id={{.Image}} state={{.State.Status}}' "$APP_CID"
            if [ "$APP_STATE" != "running" ]; then
              docker compose logs --tail=200 app
              exit 1
            fi
