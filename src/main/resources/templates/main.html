<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>떡글보글 테스트 페이지</title>
</head>
<body>
<h1>떡글보글 테스트 화면</h1>

<div sec:authorize="isAnonymous()">
    <p>로그인이 필요합니다.</p>
    <a href="/oauth2/authorization/kakao">카카오 로그인하기</a>
</div>

<div sec:authorize="isAuthenticated()">
    <p>환영합니다! 식별자(Name): <span sec:authentication="name">사용자</span>님</p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">로그아웃</button>
    </form>

    <hr>
    <h3>닉네임 중복 체크 테스트</h3>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력">
    <button onclick="checkNickname()">중복 확인</button>
    <p id="resultMessage"></p>
</div>

<script>
    function checkNickname() {
        const nickname = document.getElementById('nicknameInput').value;
        fetch(`/api/members/check-nickname?nickname=${nickname}`)
            .then(res => res.json())
            .then(isDuplicate => {
                document.getElementById('resultMessage').innerText =
                    isDuplicate ? "이미 사용 중인 닉네임입니다." : "사용 가능한 닉네임입니다.";
            });
    }
</script>
</body>
</html>
